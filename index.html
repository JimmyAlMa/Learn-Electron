<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Electron</title>
</head>
<body>
    <h1>Welcome</h1>
    <hr>
    
    <div id="firstContainer">
        <Button id="firstButton">Get Node Version</Button>
        <div id="firstDiv">
            <h2 id="firstResult"></h2>
        </div>
    </div>

    <hr>

    <div id="secondContainer">
        <Button id="secondButton">Get System Info</Button>
        <div id="secondDiv">
            <ul id="secondResult"></ul>
        </div>
    </div>

    <hr>

    <div id="thirdContainer">
        <h2>Note App (FS & Dialog Demo)</h2>

        <button id="openFile"><b>Open File</b></button>
        <button id="saveFile"><b>Save File</b></button>
        <br><br>
        <textarea id="textArea" placeholder="Type something here..." rows="15" cols="60"></textarea>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
